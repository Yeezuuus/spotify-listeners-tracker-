name: Daily Spotify fetch

on:
  schedule:
    - cron: '30 0,6,12,18 * * *'   # 8:30 PM, 2:30 AM, 8:30 AM, 2:30 PM ET (EDT)
  workflow_dispatch:        # also triggerable manually from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch listener data
        run: node scripts/fetch-data.js

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "auto: listeners $(date -u +%Y-%m-%d)"
            git push
          )
